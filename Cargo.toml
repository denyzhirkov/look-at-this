[package]
name = "look-at-this"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-quartz-core", "NSAnimation", "NSAnimationContext", "NSApplication", "NSColor", "NSGraphics", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXError", "AXUIElement", "AXValue"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "libc", "CGColor", "CGDirectDisplay", "CGEvent", "CGEventTypes", "CGGeometry", "CGImage", "CGPath", "CGRemoteOperation", "CGWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSString", "NSValue"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "CGImageDestination"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CAAnimation", "CABase", "CALayer", "CAMediaTiming", "CAMediaTimingFunction", "CAShapeLayer"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "SCError", "SCScreenshotManager", "SCShareableContent", "SCStream"] }
rmcp = { version = "3.10.0", features = ["server", "transport-io", "macros", "schemars"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
toml = "1.2.1"

# A panic anywhere ends the process: the AppKit event loop would otherwise keep
# a server with a dead MCP thread alive, still holding its macOS permissions.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
